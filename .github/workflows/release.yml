name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Refuse to publish a tag whose versions disagree. Catching this after
      # the release exists means users install a plugin whose manifest and
      # helper report different versions, and the shell's own version check
      # then refuses the helper on their machine rather than ours.
      - name: Verify versions and tag
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          manifest_version=$(jq -r '.version' manifest.json)
          cargo_version=$(cargo metadata --no-deps --format-version 1 \
            --manifest-path backend/Cargo.toml | jq -r '.packages[0].version')
          [[ "$version" == "$manifest_version" ]]
          [[ "$version" == "$cargo_version" ]]
          grep -q "^## $version" CHANGELOG.md
          # The tag must point at a commit that actually exists on this ref.
          [[ "$(git rev-list -n 1 "$GITHUB_REF_NAME")" == "$GITHUB_SHA" ]]

      - name: Full test suite
        run: |
          set -euo pipefail
          node tests/model.test.js
          node tests/manifest.test.js
          cargo fmt --manifest-path backend/Cargo.toml --all -- --check
          cargo clippy --manifest-path backend/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path backend/Cargo.toml --locked

      - name: Build helper
        run: cargo build --release --locked --manifest-path backend/Cargo.toml

      - name: Inspect helper
        run: |
          set -euo pipefail
          binary=backend/target/release/omarchy-pipelines-helper
          file "$binary"
          ldd "$binary"
          # A helper linked against something a stock Omarchy does not ship
          # would fail to start on a user's machine and nowhere else.
          ! ldd "$binary" | grep -qi "not found"
          "$binary" --version

      - name: Assemble assets
        id: assets
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          asset="omarchy-pipelines-helper-${tag}-linux-x86_64"
          cp backend/target/release/omarchy-pipelines-helper "$asset"
          sha256sum "$asset" > "${asset}.sha256"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.assets.outputs.asset }}
            ${{ steps.assets.outputs.asset }}.sha256
